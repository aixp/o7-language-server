name: Release

# A tag vX.Y.Z builds the server for six targets and makes a GitHub release
# with one archive for each target and SHA256SUMS. The asset names are part
# of the integration contract with the Zed extension (README.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: SSH key for the compiler repository (private)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.O7C_SSH_KEY }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Executable name
        shell: bash
        run: |
          exe=o7-language-server
          if [[ "${{ matrix.target }}" == *windows* ]]; then exe=$exe.exe; fi
          echo "EXE=$exe" >> "$GITHUB_ENV"
      - name: Smoke test (initialize)
        if: matrix.smoke
        shell: bash
        run: ci/smoke.sh "target/${{ matrix.target }}/release/$EXE"
      - name: Archive
        shell: bash
        run: |
          name=o7-language-server-${{ matrix.target }}
          cd "target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$GITHUB_WORKSPACE/$name.zip" "$EXE"
          else
            tar czf "$GITHUB_WORKSPACE/$name.tar.gz" "$EXE"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: o7-language-server-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum o7-language-server-* > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          front=$(awk '/^name = "o7-front"/{f=1} f&&/^version/{print $3; exit}' Cargo.lock | tr -d '"')
          rev=$(sed -n 's/^source = "git+.*#\([0-9a-f]\{40\}\)"$/\1/p' Cargo.lock | head -n 1)
          notes="Front end: o7-front $front, compiler commit $rev."
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$notes"
